# Pipeline de helmreview en GitLab
#  - MR y main: lint + tests (con helm real para los tests de integración) + build
#  - Tag vX.Y.Z: publica en el Package Registry del proyecto GitLab
#                y, opcionalmente, en PyPI (solo si PUBLISH_PYPI == "true")
#
# Equivalentes en otras plataformas: .github/workflows/ (GitHub Actions) y .cloudbuild/ (Google Cloud Build).
# Publica en PyPI desde UNA sola plataforma; PyPI rechaza subir dos veces la misma versión.
# Ver docs/ci-platforms.md.
stages: [lint, test, build, publish]

default:
  image: python:3.12-slim

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  HELM_VERSION: "v3.16.2"
  PUBLISH_PYPI: "false"   # ponlo en "true" en Settings > CI/CD > Variables si GitLab es quien publica en PyPI

cache:
  key: pip-$CI_COMMIT_REF_SLUG
  paths: [.cache/pip]

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/

lint:
  stage: lint
  script:
    - pip install ruff
    - ruff check src tests
    - ruff format --check src tests

.test-template:
  stage: test
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl ca-certificates > /dev/null
    - curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" | tar xz -C /tmp
    - mv /tmp/linux-amd64/helm /usr/local/bin/helm && helm version
    - pip install -e ".[dev]"
  script:
    - pytest --cov --cov-report=term --cov-report=xml --junitxml=report.xml
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    when: always
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

test:
  extends: .test-template
  parallel:
    matrix:
      - PY: ["3.9", "3.12", "3.13"]
  image: python:${PY}-slim

build:
  stage: build
  script:
    - pip install build twine
    - python -m build
    - twine check --strict dist/*
    - pip install dist/*.whl && helmreview --version
  artifacts:
    paths: [dist/]
    expire_in: 30 days

# Package Registry del proyecto GitLab (pip install --index-url .../packages/pypi/simple helmreview)
publish-gitlab:
  stage: publish
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  needs: [build]
  script:
    - pip install twine
    - >
      TWINE_PASSWORD=${CI_JOB_TOKEN} TWINE_USERNAME=gitlab-ci-token
      python -m twine upload --repository-url ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi dist/*

# PyPI con Trusted Publishing (OIDC): no se guarda ningún token.
# Requisito: en pypi.org, registrar un "trusted publisher" de GitLab con este proyecto,
# el archivo .gitlab-ci.yml y el environment "pypi".
publish-pypi:
  stage: publish
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/ && $PUBLISH_PYPI == "true"
  needs: [build]
  environment: pypi
  id_tokens:
    PYPI_ID_TOKEN:
      aud: pypi
  script:
    - pip install twine
    - |
      API_TOKEN=$(python - <<'PY'
      import json, os, urllib.request
      req = urllib.request.Request(
          "https://pypi.org/_/oidc/mint-token",
          data=json.dumps({"token": os.environ["PYPI_ID_TOKEN"]}).encode(),
          headers={"Content-Type": "application/json"},
      )
      print(json.load(urllib.request.urlopen(req))["token"])
      PY
      )
    - TWINE_USERNAME=__token__ TWINE_PASSWORD="${API_TOKEN}" python -m twine upload dist/*
