[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "helmreview"
dynamic = ["version"]
description = "Revisión estática local de Helm charts para Kubernetes y OpenShift"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Isaac Mendez", email = "isaac.mendez@siproset.com" }]
dependencies = ["PyYAML>=6.0"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Topic :: System :: Systems Administration",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.5", "pre-commit>=3", "build>=1"]

[project.scripts]
helmreview = "helmreview.cli:main"

[tool.setuptools.dynamic]
version = { attr = "helmreview.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["helmreview"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 120
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # las líneas largas las controla el formatter

[tool.ruff.format]
quote-style = "double"
