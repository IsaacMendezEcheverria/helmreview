# CI de helmreview en GitHub: lint + tests (con helm real) + build en cada PR y push a main.
# Equivalentes: .gitlab-ci.yml (GitLab) y .cloudbuild/cloudbuild.yaml (Google Cloud Build).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HELM_VERSION: v3.16.2

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src tests
      - run: ruff format --check src tests

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}
      - run: pip install -e ".[dev]"
      - run: pytest --cov --cov-report=term --cov-report=xml --junitxml=report.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report-py${{ matrix.python-version }}
          path: |
            report.xml
            coverage.xml

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - run: pip install dist/*.whl && helmreview --version
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 30
